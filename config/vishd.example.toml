[paths]
# Relative paths are resolved from this file's directory.
spaceranger_root = "/path/to/spaceranger/outputs"
positions_root = "/path/to/bladed/positions"
output_root = "/path/to/results"

[execution]
backend = "local"
workers = 1
use_gpu = false

# Uncomment this section and set backend = "slurm" on a SLURM system.
# [execution.slurm]
# account = "your-account"
# memory_gb = 64
# cpus = 4
# time_limit = "06:00:00"
# partition = "your-partition"
