[project]
name = "VisHD"
version = "0.1.0"
description = "Spatial hotspot (SEAC) analysis library for Visium HD"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib",
    "numpy",
    "opencv-python-headless",
    "polars",
    "scanpy",
    "scipy",
    "tqdm",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "VisHD"
