[project]
name = "VisHD"
version = "0.1.0"
description = "Spatial hotspot permutation testing for Visium HD"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib",
    "numpy",
    "opencv-python-headless",
    "polars",
    "pyarrow",
    "scanpy",
    "scipy",
    "tqdm",
]

[project.optional-dependencies]
gpu = ["cupy-cuda12x"]
slurm = ["submitit"]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "VisHD"
